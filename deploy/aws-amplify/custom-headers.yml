# Paste into: Amplify console → your app → Hosting → Custom headers → Edit.
# (If the app is ever connected to Git instead, save this file as customHttp.yml in the repo root.)
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"
  # Vite fingerprints everything in /assets, so it can be cached for a year.
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Always revalidate the HTML shell and SEO files so new deploys show up immediately.
  - pattern: 'index.html'
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: '*.xml'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
